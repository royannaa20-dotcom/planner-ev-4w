name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Pull latest code
        uses: actions/checkout@v4

      - name: Copy files to web directory
        run: |
          rsync -av --delete --exclude='.git*' --exclude='.github' ./ /var/www/planner/
