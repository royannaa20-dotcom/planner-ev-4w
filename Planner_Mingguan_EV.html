<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planner EV — Bulanan &amp; Mingguan</title>
<style>
:root{
  --bg:#e9e8e3;
  --cd:#f5f4f0;
  --ink:#161614;
  --mut:#7a7a74;
  --ln:#d5d4ce;
  --inv:#fff;
  --bad:#b3261e;
  --ok:#2e6f40;
  color-scheme:light;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e0e0d;
    --cd:#1a1a19;
    --ink:#f2f2ee;
    --mut:#8d8d86;
    --ln:#2e2e2b;
    --inv:#111;
    --bad:#f2766d;
    --ok:#7bc68e;
    color-scheme:dark;
  }
  :root:not([data-theme="light"]) select option{
    background-color:#1a1a19;
    color:#f2f2ee;
  }
}
:root[data-theme="dark"]{
  --bg:#0e0e0d;
  --cd:#1a1a19;
  --ink:#f2f2ee;
  --mut:#8d8d86;
  --ln:#2e2e2b;
  --inv:#111;
  --bad:#f2766d;
  --ok:#7bc68e;
  color-scheme:dark;
}
:root[data-theme="dark"] select option{
  background-color:#1a1a19;
  color:#f2f2ee;
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);
  color:var(--ink);
  font:14px/1.45 "Inter",system-ui,sans-serif;
  padding:14px;
  max-width:none;
  margin:auto;
}
button,input,select,textarea{font:inherit;color:inherit}
select{background-color:var(--cd);color:var(--ink)}
select option{background-color:#f5f4f0;color:#161614}
button{cursor:pointer}

/* Login Gate */
#auth-gate{
  position:fixed;
  inset:0;
  background:var(--bg);
  z-index:50;
  display:none;
  place-items:center;
  padding:16px;
}
.auth-card{
  width:min(380px,100%);
  background:var(--cd);
  border:1px solid var(--ln);
  border-radius:24px;
  padding:26px 24px;
  box-shadow:0 12px 32px rgba(0,0,0,.08);
}
.auth-card label{
  display:block;
  margin-top:12px;
  font-size:12px;
  color:var(--mut);
}
.auth-card input{
  width:100%;
  margin-top:4px;
  border:1px solid var(--ln);
  background:var(--bg);
  border-radius:12px;
  padding:10px 13px;
}
.auth-card input:focus{
  outline:none;
  border-color:var(--ink);
}
.auth-err{
  margin-top:10px;
  padding:8px 12px;
  border-radius:10px;
  background:rgba(179,38,30,.12);
  color:var(--bad);
  font-size:12.5px;
  display:none;
}

/* Navigation Pill Bar */
.nav{
  display:flex;
  gap:6px;
  align-items:center;
  background:var(--cd);
  border-radius:24px;
  padding:6px;
  margin-bottom:22px;
  flex-wrap:wrap;
}
.nav-logo{display:block;flex:none;height:auto;width:150px;max-width:calc(100% - 24px);margin:8px 12px 4px;cursor:pointer}
.nav-br{flex-basis:100%;height:0}
@media(max-width:820px){
  .nav button{padding:7px 12px;font-size:13px}
  .nav .sp{display:none}
}
.nav .sp{flex:1}
.nav button,.pill{
  border:0;
  background:none;
  border-radius:99px;
  padding:8px 16px;
  white-space:nowrap;
}
.nav button.on,.pill.on,.pri{
  background:var(--ink);
  color:var(--inv);
}
.pri{
  border:0;
  border-radius:99px;
  padding:10px 18px;
  white-space:nowrap;
}
.sec{
  border:1px solid var(--ln);
  background:none;
  border-radius:99px;
  padding:9px 16px;
  white-space:nowrap;
}
select.sec{
  background-color:var(--cd);
  color:var(--ink);
}
.sec:hover,.nav button:hover,.pill:hover{opacity:.82}
.fb-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:1px solid var(--ln)!important;
  font-size:12.5px;
}
.fb-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--mut);
  flex:none;
}
.fb-dot.online{background:var(--ok)}
.fb-dot.connecting{background:#d97706}
.fb-dot.error,.fb-dot.offline{background:var(--bad)}

h1{font-size:34px;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--mut);margin:0 0 18px}
.hdr{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.cd{background:var(--cd);border-radius:20px;padding:18px}
.cd.dk{background:var(--ink);color:var(--inv)}
.cd+.cd{margin-top:12px}
.dk small{color:#9a9a93}
small,.mut{color:var(--mut)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 12px;align-items:center}
.tabs .pill{border:1px solid var(--ln)}
.tabs .pill.on{border-color:var(--ink)}
.search{
  border:1px solid var(--ln);
  background:var(--cd);
  border-radius:99px;
  padding:8px 14px;
  min-width:200px;
}

.tag{
  font-size:11px;
  border:1px solid var(--ln);
  border-radius:99px;
  padding:2px 9px;
  color:var(--mut);
  white-space:nowrap;
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.tag.bad{color:var(--bad);border-color:var(--bad)}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.tag.solid{background:var(--ink);color:var(--inv);border-color:var(--ink)}

.av{
  font-size:10px;
  font-weight:700;
  width:22px;
  height:22px;
  border-radius:50%;
  background:var(--ink);
  color:var(--inv);
  display:inline-grid;
  place-items:center;
  flex:none;
}

.empty{text-align:center;padding:42px 16px}
.empty p{color:var(--mut);margin:6px 0 18px;max-width:480px;margin-left:auto;margin-right:auto}

/* Month + Week Master Timeline */
.tl-wrap{
  position:relative;
  overflow-x:auto;
  border:1px solid var(--ln);
  border-radius:14px;
  background:var(--bg);
}
.tl-inner{
  position:relative;
  min-width:max-content;
}
.tl-hdr{
  position:sticky;
  top:0;
  z-index:10;
  background:var(--cd);
  border-bottom:1px solid var(--ln);
}
.tl-hrow{display:flex}
.tl-corner{
  position:sticky;
  left:0;
  z-index:12;
  width:190px;
  min-width:190px;
  background:var(--cd);
  border-right:1px solid var(--ln);
  padding:6px 12px;
  font-size:12px;
  font-weight:600;
  color:var(--mut);
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.tl-mcell{
  border-right:1px solid var(--ln);
  border-bottom:1px solid var(--ln);
  text-align:center;
  font-weight:700;
  font-size:12.5px;
  padding:7px 4px;
  cursor:pointer;
  user-select:none;
}
.tl-mcell:hover,.tl-mcell.on{background:var(--ink);color:var(--inv)}
.tl-wcell{
  border-right:1px dashed var(--ln);
  text-align:center;
  padding:4px 2px;
  cursor:pointer;
  user-select:none;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  line-height:1.15;
}
.tl-wcell b{font-size:11px;font-weight:600;color:var(--ink)}
.tl-wcell span{font-size:9.5px;color:var(--mut);margin-top:1px}
.tl-wcell:hover,.tl-wcell.on{background:var(--ink)}
.tl-wcell:hover b,.tl-wcell:hover span,.tl-wcell.on b,.tl-wcell.on span{color:var(--inv)}
.tl-wcell.mend{border-right:1px solid var(--ln)}
.tl-wcell.cur{background:rgba(128,128,128,.14)}
.tl-wcell.cur b{text-decoration:underline}

/* Swimlane Rows */
.lane{
  display:flex;
  border-bottom:1px solid var(--ln);
  position:relative;
}
.lane:last-child{border-bottom:0}
.lane-lbl{
  position:sticky;
  left:0;
  z-index:8;
  width:190px;
  min-width:190px;
  background:var(--cd);
  border-right:1px solid var(--ln);
  padding:10px 12px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  gap:4px;
}
.lane-lbl b{
  font-size:12.5px;
  line-height:1.25;
  word-break:break-word;
}
.lane-lbl button{
  align-self:flex-start;
  border:1px solid var(--ln);
  background:none;
  border-radius:99px;
  padding:2px 9px;
  font-size:11px;
  color:var(--mut);
  margin-top:2px;
}
.lane-lbl button:hover{border-color:var(--ink);color:var(--ink)}
.lane-track{
  position:relative;
  flex:1;
}
.vgrid{
  position:absolute;
  inset:0;
  display:flex;
  pointer-events:none;
}
.vcol{
  height:100%;
  border-right:1px dashed var(--ln);
  opacity:.55;
}
.vcol.mend{border-right:1px solid var(--ln);opacity:.9}
.vcol.cur{background:var(--ink);opacity:.04}

/* Vertical Holiday / Special Period Band */
.hband{
  position:absolute;
  top:0;
  bottom:0;
  z-index:2;
  pointer-events:none;
  display:flex;
  align-items:center;
  justify-content:center;
  border-left:1px solid var(--ln);
  border-right:1px solid var(--ln);
}
.hband span{
  writing-mode:vertical-rl;
  text-orientation:upright;
  font-size:10px;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
  white-space:nowrap;
  padding:4px 0;
}
.hb-amber{background:rgba(234,179,8,.24);color:var(--ink)}
.hb-red{background:rgba(179,38,30,.24);color:var(--ink)}
.hb-slate{background:rgba(120,120,116,.18);color:var(--ink)}

/* Task Bars on Timeline */
.bar{
  position:absolute;
  z-index:4;
  border-radius:11px;
  padding:5px 10px;
  cursor:grab;
  user-select:none;
  border:1px solid rgba(0,0,0,.18);
  display:flex;
  flex-direction:column;
  justify-content:center;
  overflow:hidden;
  transition:box-shadow .15s;
}
.bar:hover{z-index:7;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.bar.drag{opacity:.85;cursor:grabbing;z-index:15}
.bar-t{
  font-size:12px;
  font-weight:600;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  display:flex;
  align-items:center;
  gap:5px;
}
.bar-d{
  font-size:10.5px;
  opacity:.84;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  margin-top:1px;
}
.rz{
  position:absolute;
  top:0;
  bottom:0;
  width:7px;
  cursor:ew-resize;
}
.rz.l{left:0}.rz.r{right:0}

/* Muted Harmonious Bar Colors */
.c-sage{background:#c5dec0;color:#142611;border-color:#8fb388}
.c-plum{background:#dec2dc;color:#291127;border-color:#b38cb0}
.c-amber{background:#efe59c;color:#2b2605;border-color:#c4b762}
.c-sky{background:#bfd8ec;color:#0e2436;border-color:#84acc9}
.c-ink{background:var(--ink);color:var(--inv);border-color:var(--ink)}

:root[data-theme="dark"] .c-sage{background:#2d4729;color:#e4f2e1;border-color:#56824f}
:root[data-theme="dark"] .c-plum{background:#472b45;color:#f3e3f2;border-color:#855682}
:root[data-theme="dark"] .c-amber{background:#4d4517;color:#faf4c8;border-color:#8c7f32}
:root[data-theme="dark"] .c-sky{background:#223c52;color:#dfeefc;border-color:#4b799e}

.bar.st-b{border:1.5px dashed var(--bad)!important}

.dep-svg{
  position:absolute;
  top:0;
  left:190px;
  pointer-events:none;
  z-index:5;
}

/* Detail Cards */
.dgrid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
  gap:12px;
  margin-top:12px;
}
.dcard{
  background:var(--bg);
  border:1px solid var(--ln);
  border-radius:16px;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:8px;
}
.dcard:hover{border-color:var(--ink)}
.dcard-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.dcard-hd b{font-size:15px;cursor:pointer;line-height:1.3}
.dcard-hd b:hover{text-decoration:underline}
.dcard-desc{
  font-size:13px;
  background:var(--cd);
  padding:8px 10px;
  border-radius:10px;
  white-space:pre-line;
}
.chk-list{display:flex;flex-direction:column;gap:4px}
.chk{
  display:flex;
  align-items:flex-start;
  gap:8px;
  font-size:13px;
  padding:3px 4px;
  border-radius:8px;
}
.chk:hover{background:var(--cd)}
.chk input{margin-top:3px;width:15px;height:15px;accent-color:var(--ink);cursor:pointer;flex:none}
.chk.done span{text-decoration:line-through;color:var(--mut)}

/* Team & Member Cards */
.tgrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:12px;
}
.mchip{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:var(--bg);
  border:1px solid var(--ln);
  border-radius:99px;
  padding:4px 10px 4px 5px;
  font-size:13px;
}
.mchip button{
  border:0;
  background:none;
  color:var(--mut);
  padding:0 2px;
  font-size:14px;
  line-height:1;
}
.mchip button:hover{color:var(--bad)}

/* Clickable Member Selector Pills inside Modal */
.mpick{
  display:inline-flex;
  align-items:center;
  gap:6px;
  border:1px solid var(--ln);
  background:var(--bg);
  border-radius:99px;
  padding:5px 12px 5px 6px;
  font-size:12.5px;
  cursor:pointer;
  user-select:none;
}
.mpick.on{
  background:var(--ink);
  color:var(--inv);
  border-color:var(--ink);
}
.mpick.on .av{
  background:var(--inv);
  color:var(--ink);
}

/* Kanban Board */
.kb{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.kc{
  background:var(--bg);
  border-radius:14px;
  padding:12px;
  margin-top:8px;
  cursor:pointer;
  display:flex;
  gap:8px;
  justify-content:space-between;
  align-items:flex-start;
}
.kc:hover{outline:1px solid var(--ink)}
.kc button{border:1px solid var(--ln);background:none;border-radius:99px;width:28px;height:28px;flex:none}

.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--ln)}
.row:first-of-type{border-top:0}

/* Modal & Toast */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;place-items:center;z-index:60;padding:12px}
#md{width:min(560px,100%);background:var(--cd);border-radius:20px;padding:20px;max-height:92vh;overflow:auto}
#md label{display:block;margin-top:11px;color:var(--mut);font-size:12px}
#md input,#md select,#md textarea{
  width:100%;
  margin-top:4px;
  border:1px solid var(--ln);
  background:var(--bg);
  border-radius:12px;
  padding:9px 12px;
}
#md .cl{display:flex;gap:6px;align-items:center;margin-top:6px}
#md .cl input[type=checkbox]{width:18px;height:18px;margin:0;flex:none}
#md .cl input{margin:0}
#md .chk-opt{
  display:flex;
  align-items:center;
  gap:8px;
  margin-top:7px;
  color:var(--ink);
  font-size:13px;
  cursor:pointer;
}
#md .chk-opt input{
  width:16px;
  height:16px;
  margin:0;
  accent-color:var(--ink);
}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.two{grid-template-columns:1fr}}

#tip{
  position:fixed;
  z-index:30;
  pointer-events:none;
  background:var(--ink);
  color:var(--inv);
  border-radius:12px;
  padding:9px 12px;
  max-width:310px;
  font-size:12px;
  display:none;
  line-height:1.4;
}
#toast{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  background:var(--ink);
  color:var(--inv);
  border-radius:99px;
  padding:8px 8px 8px 20px;
  display:none;
  gap:14px;
  align-items:center;
  z-index:70;
  max-width:92vw;
}
#toast button{background:var(--inv);color:var(--ink);border:0;border-radius:99px;padding:6px 14px}

/* Print / PDF Sheet */
#print-sheet{display:none}
@media print{
  @page{margin:12mm}
  body{
    background:#fff!important;
    color:#111!important;
    padding:0!important;
    max-width:none!important;
  }
  .nav,#app,#ov,#toast,#tip,#auth-gate{display:none!important}
  #print-sheet{
    display:block!important;
    background:#fff!important;
    color:#111!important;
    font:11pt/1.4 "Inter",system-ui,sans-serif;
  }
  #print-sheet table{page-break-inside:auto}
  #print-sheet tr{page-break-inside:avoid;page-break-after:auto}
  #print-sheet thead{display:table-header-group}
}
.vcol{pointer-events:auto;cursor:pointer;position:relative}
.vcol:hover{opacity:1;background:rgba(128,128,128,.14)}
.vcol:hover::after{content:"+";position:absolute;inset:0;display:grid;place-items:center;color:var(--mut);font-size:22px;font-weight:300}
/* Kalender pemilih tanggal */
.cal-top{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
@media(max-width:560px){.cal-top{grid-template-columns:1fr}}
.cal-sel{background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.cal-sel small{display:block;font-weight:600;color:var(--mut);margin-bottom:2px}
.cal-sel b{font-size:13px;font-weight:600;display:block}
.cal-sel span{font-size:12px;color:var(--mut)}
.cal-sel.on{border-color:#4cc2ff;box-shadow:0 0 0 1px #4cc2ff}
.cal-box{background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:10px;margin-top:8px}
.cal-nav{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.cal-nav b{flex:1;font-size:14px;font-weight:600}
.cal-nav button{border:1px solid var(--ln);background:none;border-radius:8px;min-width:32px;height:28px;color:var(--ink);cursor:pointer;font:inherit;font-size:11px}
.cal-nav button:hover{border-color:var(--ink)}
.cal-nav button.t{padding:0 10px;font-size:12px}
.cal-g{display:grid;grid-template-columns:34px repeat(7,1fr);gap:2px 0}
.cal-h{font-size:11px;font-weight:600;text-align:center;color:var(--mut);padding:4px 0}
.cal-w{font-size:10px;color:var(--mut);display:grid;place-items:center;height:34px}
.cal-d{height:34px;border:0;background:none;color:var(--ink);font:inherit;font-size:13px;display:grid;place-items:center;cursor:pointer;padding:0}
.cal-d span{width:30px;height:30px;display:grid;place-items:center;border-radius:50%}
.cal-d:hover span{background:rgba(128,128,128,.28)}
.cal-d.o{color:var(--mut)}
.cal-d.today span{background:#4cc2ff;color:#001018;font-weight:700}
.cal-w.rb,.cal-d.rb{background:rgba(76,194,255,.13)}
.cal-w.re,.cal-d.re{background:rgba(76,194,255,.26)}
.cal-w.rb{border-radius:8px 0 0 8px}
.cal-d.rb.wr{border-radius:0 8px 8px 0}
.cal-d.re span{font-weight:700}
.cal-prev{font-size:12px;color:var(--ok);margin-top:8px;font-weight:500}
.cal-sum{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;margin-top:4px;background:var(--bg);border:1px solid var(--ln);border-radius:14px;padding:11px 14px;color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer;text-align:left}
.cal-sum i{font-style:normal;font-weight:500;font-size:12px;color:var(--mut);flex:none}
.cal-sum.on{border-color:#4cc2ff;box-shadow:0 0 0 1px #4cc2ff}
.cal-dur{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--mut)}
.cal-dur span{flex:1}
.cal-dur b{min-width:72px;text-align:center;color:var(--ink);font-size:13px;font-weight:600}
.cal-dur button{border:1px solid var(--ln);background:none;border-radius:8px;width:30px;height:28px;color:var(--ink);cursor:pointer;font:inherit;font-size:15px;line-height:1}
.cal-dur button:hover:not(:disabled){border-color:var(--ink)}
.cal-dur button:disabled{opacity:.35;cursor:default}

<script>
// =========================================================================
// KONFIGURASI FIREBASE BAWAAN (ISI DI SINI AGAR OTOMATIS TERHUBUNG)
// =========================================================================
const DEFAULT_FIREBASE_CONFIG = {
  apiKey: "",
  authDomain: "",
  databaseURL: "https://planner-polytron-4w-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};
const DEFAULT_FIREBASE_PATH = "planner-ev/master";
const DEFAULT_USERS_PATH = "planner-ev/users";
// =========================================================================

const $ = s => document.querySelector(s);
const KEY = "planner-ev-master-v3";
const FB_CFG_KEY = "planner-ev-firebase-cfg-v1";
const AUTH_SESSION_KEY = "planner-ev-auth-session-v1";
const MON = ["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
const MON_F = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
const ST = { p: "Rencana", d: "Dikerjakan", b: "Terblokir", x: "Selesai" };
const BAR_COLORS = {
  sage:  "Hijau Sage",
  plum:  "Ungu Plum",
  amber: "Kuning Amber",
  sky:   "Biru Langit",
  ink:   "Hitam / Kontras"
};
const HOL_TONES = {
  amber: "Kuning (Libur / Cuti)",
  red:   "Merah (Libur Besar / Tutup)",
  slate: "Abu-abu (Periode Khusus)"
};

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const ini = s => String(s || "").trim().split(/\s+/).map(w => w[0] || "").join("").slice(0, 2).toUpperCase() || "?";
const sanitizeUserId = raw => String(raw || "").trim().toLowerCase().replace(/[^a-z0-9._-]/g, "");

// Helper untuk membaca password baik format ringkas (users/{id}: "pass") maupun objek
function getStoredPassword(entry) {
  if (typeof entry === "string" || typeof entry === "number") return String(entry);
  if (entry && typeof entry === "object" && entry.password !== undefined) return String(entry.password);
  return "";
}

// Date & Week Helpers (Monday-anchored)
function parseYMD(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function fmtYMD(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function getMonday(d) {
  const dt = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const day = (dt.getDay() + 6) % 7;
  dt.setDate(dt.getDate() - day);
  return dt;
}
function addWeeks(ymdStr, n) {
  const d = parseYMD(ymdStr);
  d.setDate(d.getDate() + n * 7);
  return fmtYMD(d);
}
function diffWeeks(a, b) {
  return Math.round((parseYMD(b) - parseYMD(a)) / (7 * 86400000));
}
function isoWeekNum(d) {
  const dt = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNum = dt.getUTCDay() || 7;
  dt.setUTCDate(dt.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(dt.getUTCFullYear(), 0, 1));
  return Math.ceil((((dt - yearStart) / 86400000) + 1) / 7);
}

function wkMeta(monYmd) {
  const mon = parseYMD(monYmd);
  const thu = new Date(mon); thu.setDate(mon.getDate() + 3);
  const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  const wNum = isoWeekNum(mon);
  const mIdx = thu.getMonth();
  const yr = thu.getFullYear();
  const mKey = `${yr}-${String(mIdx + 1).padStart(2, "0")}`;
  const mShort = `${MON[mIdx]} ${yr}`;
  const mFull = `${MON_F[mIdx]} ${yr}`;

  const firstOfMonth = new Date(yr, mIdx, 1);
  let firstMon = getMonday(firstOfMonth);
  const firstThu = new Date(firstMon); firstThu.setDate(firstMon.getDate() + 3);
  if (firstThu.getMonth() !== mIdx) {
    firstMon.setDate(firstMon.getDate() + 7);
  }
  const wkOfMonth = Math.max(1, Math.round((mon - firstMon) / (7 * 86400000)) + 1);

  const rangeShort = mon.getMonth() === sun.getMonth()
    ? `${mon.getDate()}–${sun.getDate()} ${MON[mon.getMonth()]}`
    : `${mon.getDate()} ${MON[mon.getMonth()]} – ${sun.getDate()} ${MON[sun.getMonth()]}`;
  const startDayLabel = `${mon.getDate()} ${MON[mon.getMonth()]}`;

  return {
    ymd: monYmd,
    wNum,
    wCode: `W${wNum}`,
    wkOfMonth,
    mWeekShort: `Mg ${wkOfMonth}`,
    mWeekLabel: `Minggu ${wkOfMonth}`,
    mKey,
    mShort,
    mFull,
    rangeShort,
    startDayLabel
  };
}

const CUR_MON = fmtYMD(getMonday(new Date()));

function defaultTeams() {
  return [
    { id: "ES", name: "Energy Storage EV 4W", short: "Energy Storage", members: [] },
    { id: "HV", name: "HVAC EV 4W", short: "HVAC", members: [] },
    { id: "KD", name: "4W Knock Down", short: "Knock Down", members: [] },
    { id: "VC", name: "Vehicle Control Unit EV 4W", short: "VCU", members: [] }
  ];
}

function emptyState() {
  return {
    v: 1,
    startWk: addWeeks(CUR_MON, -2),
    weeksCount: 30,
    r7: 1,
    teams: defaultTeams(),
    cats: [],
    holidays: [],
    tasks: []
  };
}

const toArr = v => Array.isArray(v) ? v : (v && typeof v === "object" ? Object.values(v) : []);

function normalizeState(d) {
  if (!d || typeof d !== "object") return emptyState();
  const rawTeams = toArr(d.teams);
  const teams = (rawTeams.length ? rawTeams : defaultTeams()).map(tm => ({
    id: tm.id || uid(),
    name: tm.name || "Tim",
    short: tm.short || tm.name || "Tim",
    members: toArr(tm.members).filter(Boolean)
  }));
  const cats = toArr(d.cats).map(c => ({
    id: c.id || ("cat_" + uid()),
    name: c.name || "Kategori"
  }));
  const holidays = toArr(d.holidays).map(h => ({
    id: h.id || ("hol_" + uid()),
    title: h.title || "Libur",
    startWk: h.startWk || CUR_MON,
    endWk: h.endWk || h.startWk || CUR_MON,
    tone: h.tone || "amber"
  }));
  const tasks = toArr(d.tasks).map(t => ({
    id: t.id || ("t_" + uid()),
    title: t.title || "Tugas",
    team: t.team || (teams[0] && teams[0].id) || "VC",
    pics: toArr(t.pics).filter(Boolean),
    cat: t.cat || "",
    st: ["p", "d", "b", "x"].includes(t.st) ? t.st : "p",
    startWk: t.startWk || CUR_MON,
    endWk: t.endWk || t.startWk || CUR_MON,
    desc: t.desc || "",
    items: toArr(t.items).map(it => ({ t: it.t || "", x: !!it.x })),
    out: t.out || "",
    color: t.color || "sage",

  }));

  };

function getSavedFbSettings() {
  try {
    const raw = localStorage.getItem(FB_CFG_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.disabled) return null;
      if (parsed && parsed.config && parsed.config.databaseURL) {
        const cleanPath = (parsed.dbPath || DEFAULT_FIREBASE_PATH).replace(/^\/+|\/+$/g, "") || DEFAULT_FIREBASE_PATH;
        const usersPath = (parsed.usersPath || cleanPath.replace(/\/[^/]+$/, "/users") || DEFAULT_USERS_PATH).replace(/^\/+|\/+$/g, "");
        return {
          config: parsed.config,
          dbPath: cleanPath,
          usersPath
        };
      }
    }
  } catch (e) {}

  if (DEFAULT_FIREBASE_CONFIG && DEFAULT_FIREBASE_CONFIG.databaseURL && DEFAULT_FIREBASE_CONFIG.databaseURL.trim().startsWith("https://")) {
    const cleanCfg = {};
    Object.entries(DEFAULT_FIREBASE_CONFIG).forEach(([k, v]) => {
      if (v && String(v).trim()) cleanCfg[k] = String(v).trim();
    });
    cleanCfg.databaseURL = cleanCfg.databaseURL.replace(/\/+$/, "");
    const cleanPath = (DEFAULT_FIREBASE_PATH || "planner-ev/master").replace(/^\/+|\/+$/g, "") || "planner-ev/master";
    const usersPath = (DEFAULT_USERS_PATH || "planner-ev/users").replace(/^\/+|\/+$/g, "") || "planner-ev/users";
    return {
      config: cleanCfg,
      dbPath: cleanPath,
      usersPath,
      fromHtml: true
    };
  }
  return null;
}

function pushStateToFirebase(immediate = false) {
  if (!fbRef) return;
  const clean = JSON.parse(JSON.stringify(normalizeState(S)));
  const hash = JSON.stringify(clean);
  fbLastHash = hash;

  const doWrite = () => {
    if (!fbRef) return;
    fbRef.set(clean).then(() => {
      if (fbStatus === "error") {
        fbStatus = "online";
        fbErrorMsg = "";
        updateFbBadge();
      }
    }).catch(err => {
      fbStatus = "error";
      fbErrorMsg = err && err.message ? err.message : String(err);
      updateFbBadge();
      toast("Gagal simpan ke Firebase: " + fbErrorMsg);
    });
  };

  clearTimeout(fbWriteTimer);
  if (immediate) doWrite();
  else fbWriteTimer = setTimeout(doWrite, 150);
}

function persist() {
  try {
    localStorage.setItem(KEY, JSON.stringify(S));
  } catch (e) {
    toast("Tidak bisa menyimpan di browser ini. Pakai Cadangkan untuk menyimpan ke file.");
  }
  pushStateToFirebase(false);
}

function detachFirebaseListeners() {
  clearTimeout(fbWriteTimer);
  if (fbRef) {
    try { fbRef.off(); } catch (e) {}
    fbRef = null;
  }
  if (fbUsersRef) {
    try { fbUsersRef.off(); } catch (e) {}
    fbUsersRef = null;
  }
  if (fbConnRef) {
    try { fbConnRef.off(); } catch (e) {}
    fbConnRef = null;
  }
  fbUsersLoaded = false;
  fbUsersMap = {};
}

async function initFirebaseSync(settings, isManualConnect = false) {
  if (!settings || !settings.config || !settings.config.databaseURL) {
    fbStatus = "off";
    updateFbBadge();
    syncAuthGate();
    return false;
  }
  if (typeof firebase === "undefined") {
    fbStatus = "error";
    fbErrorMsg = "SDK Firebase gagal dimuat (periksa koneksi internet).";
    updateFbBadge();
    syncAuthGate();
    if (isManualConnect) toast(fbErrorMsg);
    return false;
  }

  detachFirebaseListeners();
  fbStatus = "connecting";
  fbErrorMsg = "";
  updateFbBadge();
  syncAuthGate();

  try {
    const appName = "planner-ev-app-" + (settings.config.projectId || "default");
    const existing = firebase.apps.find(a => a.name === appName);
    if (existing) {
      await existing.delete();
    }
    fbApp = firebase.initializeApp(settings.config, appName);
    fbDb = firebase.database(fbApp);

    const cleanPath = (settings.dbPath || "planner-ev/master").replace(/^\/+|\/+$/g, "") || "planner-ev/master";
    const usersPath = (settings.usersPath || cleanPath.replace(/\/[^/]+$/, "/users") || "planner-ev/users").replace(/^\/+|\/+$/g, "");

    fbRef = fbDb.ref(cleanPath);
    fbUsersRef = fbDb.ref(usersPath);
    fbConnRef = fbDb.ref(".info/connected");

    fbConnRef.on("value", snap => {
      if (snap.val() === true) {
        if (fbStatus !== "error") fbStatus = "online";
      } else if (fbStatus === "online") {
        fbStatus = "offline";
      }
      updateFbBadge();
    });

    // Muat daftar ID & Password dari Firebase secara real-time
    const initUsersSnap = await fbUsersRef.once("value");
    fbUsersMap = initUsersSnap.val() || {};
    fbUsersLoaded = true;

    fbUsersRef.on("value", snap => {
      fbUsersMap = snap.val() || {};
      fbUsersLoaded = true;
      syncAuthGate();
      if (page === "tim" && $("#ov").style.display !== "grid") {
        render();
      }
    });

    // Initial handshake untuk data planner
    const initSnap = await fbRef.once("value");
    const remoteVal = initSnap.val();
    const localHasData = S.tasks.length > 0 || S.cats.length > 0 || allMembersList().length > 0;
    const remoteNorm = remoteVal ? normalizeState(remoteVal) : null;
    const remoteHasData = remoteNorm && (remoteNorm.tasks.length > 0 || remoteNorm.cats.length > 0 || remoteNorm.teams.some(tm => (tm.members || []).length > 0));

    if (!remoteHasData && localHasData) {
      pushStateToFirebase(true);
      if (isManualConnect) toast("Terhubung! Data lokal berhasil diunggah ke Firebase.");
    } else if (remoteHasData && !localHasData) {
      S = remoteNorm;
      fbLastHash = JSON.stringify(S);
      localStorage.setItem(KEY, JSON.stringify(S));
      render();
      if (isManualConnect) toast("Terhubung! Data dimuat dari Firebase.");
    } else if (remoteHasData && localHasData) {
      const localHash = JSON.stringify(normalizeState(S));
      const remoteHash = JSON.stringify(remoteNorm);
      if (localHash !== remoteHash && isManualConnect) {
        const useRemote = confirm(
          `Data ditemukan di Firebase (${remoteNorm.tasks.length} tugas) dan di browser ini (${S.tasks.length} tugas).\n\n` +
          `• Klik OK untuk memakai data dari Firebase.\n` +
          `• Klik Batal untuk mengirim data browser ini ke Firebase.`
        );
        if (useRemote) {
          S = remoteNorm;
          fbLastHash = remoteHash;
          localStorage.setItem(KEY, JSON.stringify(S));
          render();
        } else {
          pushStateToFirebase(true);
        }
      } else {
        S = remoteNorm;
        fbLastHash = remoteHash;
        localStorage.setItem(KEY, JSON.stringify(S));
        render();
      }
      if (isManualConnect) toast("Firebase Realtime Database tersinkron.");
    } else {
      pushStateToFirebase(true);
      if (isManualConnect) toast("Firebase Realtime Database terhubung.");
    }

    fbStatus = "online";
    updateFbBadge();
    syncAuthGate();

    // Real-time listener untuk data planner
    fbRef.on("value", snap => {
      const val = snap.val();
      if (!val) return;
      const norm = normalizeState(val);
      const hash = JSON.stringify(norm);
      if (hash === fbLastHash) return;
      fbLastHash = hash;
      S = norm;
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
      if ($("#ov").style.display !== "grid") {
        render();
      }
      toast("Data diperbarui dari Firebase");
    }, err => {
      fbStatus = "error";
      fbErrorMsg = err && err.message ? err.message : String(err);
      updateFbBadge();
      syncAuthGate();
    });

    return true;
  } catch (err) {
    fbStatus = "error";
    fbErrorMsg = err && err.message ? err.message : String(err);
    updateFbBadge();
    syncAuthGate();
    if (isManualConnect) toast("Koneksi Firebase gagal: " + fbErrorMsg);
    return false;
  }
}

async function addFirebaseUserAccount(idInput, passInput) {
  if (!fbUsersRef) {

  const id = sanitizeUserId(idInput);

  if (!pass || pass.length < 4) {

    return false;
  }
  if (fbUsersMap[id] !== undefined) {
    toast(`ID "${id}" sudah ada. Gunakan ID lain atau ganti password.`);
    return false;
  }

  try {
    await fbUsersRef.child(id).set(pass);
    toast(`ID "${id}" berhasil ditambahkan ke Firebase`);
    return true;
  } catch (e) {
    toast("Gagal menambah ID: " + (e.message || e));
    return false;
  }
}

async function resetFirebaseUserPassword(userId) {
  if (!fbUsersRef || fbUsersMap[userId] === undefined) return;

  try {
    await fbUsersRef.child(userId).set(newPass);
    toast(`Password untuk "${userId}" diperbarui`);

    toast("Gagal memperbarui password: " + (e.message || e));
  }
}

async function deleteFirebaseUserAccount(userId) {
  if (!fbUsersRef || fbUsersMap[userId] === undefined) return;
  const allIds = Object.keys(fbUsersMap);
  if (allIds.length <= 1) {
    toast("Tidak bisa menghapus satu-satunya ID tersisa.");

  }
  if (!confirm(`Hapus ID "${userId}" dari Firebase?`)) return;
  try {
    await fbUsersRef.child(userId).remove();
    toast(`ID "${userId}" dihapus`);
  } catch (e) {
    toast("Gagal menghapus ID: " + (e.message || e));
  }
}

function parseFirebaseSnippet(rawText) {
  const txt = String(rawText || "").trim();
  if (!txt) return null;
  const keys = ["apiKey", "authDomain", "databaseURL", "projectId", "storageBucket", "messagingSenderId", "appId", "measurementId"];
  const found = {};
  keys.forEach(k => {
    const re = new RegExp(`["']?${k}["']?\s*:\s*["']([^"']+)["']`);
    const m = txt.match(re);
    if (m && m[1]) found[k] = m[1].trim();
  });
  return Object.keys(found).length ? found : null;
}

async function saveAndConnectFirebase() {
  const snippetParsed = parseFirebaseSnippet($("#fb_snippet").value) || {};
  const databaseURL = ($("#fb_dburl").value.trim() || snippetParsed.databaseURL || "").replace(/\/+$/, "");
  const apiKey = $("#fb_apikey").value.trim() || snippetParsed.apiKey || "";
  const projectId = $("#fb_projid").value.trim() || snippetParsed.projectId || "";
  const appId = $("#fb_appid").value.trim() || snippetParsed.appId || "";
  const authDomain = $("#fb_authdom").value.trim() || snippetParsed.authDomain || (projectId ? `${projectId}.firebaseapp.com` : "");
  const dbPath = ($("#fb_path").value.trim() || "planner-ev/master").replace(/^\/+|\/+$/g, "") || "planner-ev/master";
  const usersPath = ($("#fb_upath").value.trim() || "planner-ev/users").replace(/^\/+|\/+$/g, "") || "planner-ev/users";

  if (!databaseURL || !databaseURL.startsWith("https://")) {
    toast("Isi Database URL Firebase yang valid (diawali https://)");
    return;
  }

  const settings = {
    config: {
      apiKey,
      authDomain,
      databaseURL,
      projectId,
      appId
    },
    dbPath,
    usersPath
  };

  try {
    localStorage.setItem(FB_CFG_KEY, JSON.stringify(settings));
  } catch (e) {}

  closeModal();
  await initFirebaseSync(settings, true);
  if (page === "atur") render();
}

function forcePushFirebase() {
  if (!fbRef) {
    toast("Firebase belum terhubung");
    return;
  }
  pushStateToFirebase(true);
  toast("Seluruh data lokal dikirim ke Firebase");
}

function disconnectFirebase() {
  if (!confirm("Putuskan koneksi Firebase dari browser ini? Data tetap aman di penyimpanan lokal browser.")) return;
  detachFirebaseListeners();
  try {
    if (DEFAULT_FIREBASE_CONFIG && DEFAULT_FIREBASE_CONFIG.databaseURL) {
      localStorage.setItem(FB_CFG_KEY, JSON.stringify({ disabled: true }));
    } else {
      localStorage.removeItem(FB_CFG_KEY);
    }
  } catch (e) {}
  saveAuthSession(null);
  fbStatus = "off";
  fbErrorMsg = "";
  fbLastHash = "";
  updateFbBadge();
  syncAuthGate();
  closeModal();
  if (page === "atur") render();
  toast("Koneksi Firebase diputuskan");
}

function toast(msg, undo) {
  const e = $("#toast");
  $("#tt").textContent = msg;
  const b = $("#tu");
  b.style.display = undo ? "" : "none";
  b.onclick = () => { e.style.display = "none"; if (undo) undo(); };
  e.style.display = "flex";
  clearTimeout(toast.t);
  toast.t = setTimeout(() => e.style.display = "none", 6000);
}

const byId = id => S.tasks.find(t => t.id === id);
const teamById = id => S.teams.find(tm => tm.id === id) || { id: "", name: "Tanpa Tim", short: "Umum", members: [] };
const catName = id => (S.cats.find(c => c.id === id) || {}).name || "Umum";

function spanText(sWk, eWk) {
  const a = wkMeta(sWk), b = wkMeta(eWk);
  const cnt = Math.max(1, diffWeeks(sWk, eWk) + 1);
  if (sWk === eWk) {
    return `${a.mWeekLabel} ${a.mShort} (${a.rangeShort}) · ${a.wCode}`;
  }
  return `${a.mWeekShort} ${a.mShort} – ${b.mWeekShort} ${b.mShort} (${cnt} minggu)`;
}

function buildCols() {
  const cols = [];
  for (let i = 0; i < S.weeksCount; i++) {
    cols.push(wkMeta(addWeeks(S.startWk, i)));
  }
  const months = [];
  cols.forEach((c, idx) => {
    const last = months[months.length - 1];
    if (last && last.mKey === c.mKey) {
      last.span++;
      last.endIdx = idx;
    } else {
      months.push({ mKey: c.mKey, mShort: c.mShort, mFull: c.mFull, startIdx: idx, endIdx: idx, span: 1 });
    }
  });
  return { cols, months };
}

function allMembersList() {
  const set = new Set();
  S.teams.forEach(tm => (tm.members || []).forEach(m => set.add(m)));
  S.tasks.forEach(t => (t.pics || []).forEach(m => set.add(m)));
  return [...set];
}

function visibleTasks() {
  const q = qText.trim().toLowerCase();
  return S.tasks.filter(t => {
    if (fTeam !== "*" && t.team !== fTeam) return false;
    if (fMember !== "*" && !(t.pics || []).includes(fMember)) return false;
    if (fCat !== "*" && t.cat !== fCat) return false;
    if (fSt !== "*" && t.st !== fSt) return false;
    if (q) {
      const hay = [
        t.title,
        t.desc,
        t.out,
        t.bl,
        teamById(t.team).name,
        ...(t.pics || []),
        ...(t.items || []).map(x => x.t)
      ].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function packRows(tasks) {
  const sorted = [...tasks].sort((a, b) => a.startWk.localeCompare(b.startWk) || a.endWk.localeCompare(b.endWk));
  const ends = [];
  const pos = new Map();
  sorted.forEach(t => {
    let r = ends.findIndex(e => e < t.startWk);
    if (r === -1) { r = ends.length; ends.push(t.endWk); }
    else ends[r] = t.endWk;
    pos.set(t.id, r);
  });
  return { rows: Math.max(1, ends.length), pos };
}

function filterBar() {
  const members = fTeam === "*"
    ? allMembersList()
    : (teamById(fTeam).members || []);

  return `
  <div class="tabs">
    <button class="pill ${fTeam === "*" ? "on" : ""}" onclick="fTeam='*';fMember='*';render()">Semua tim</button>
    ${S.teams.map(tm => `<button class="pill ${fTeam === tm.id ? "on" : ""}" onclick="fTeam='${tm.id}';fMember='*';render()">${esc(tm.short || tm.name)}</button>`).join("")}
    <span style="flex:1"></span>
    ${members.length ? `
      <select class="sec" style="padding:7px 12px" onchange="fMember=this.value;render()">
        <option value="*" ${fMember === "*" ? "selected" : ""}>Semua anggota (${members.length})</option>
        ${members.map(m => `<option value="${esc(m)}" ${fMember === m ? "selected" : ""}>${esc(m)}</option>`).join("")}
      </select>` : ""}
    ${S.cats.length ? `
      <select class="sec" style="padding:7px 12px" onchange="fCat=this.value;render()">
        <option value="*" ${fCat === "*" ? "selected" : ""}>Semua kategori</option>
        ${S.cats.map(c => `<option value="${c.id}" ${fCat === c.id ? "selected" : ""}>${esc(c.name)}</option>`).join("")}
      </select>` : ""}
    <select class="sec" style="padding:7px 12px" onchange="fSt=this.value;render()">
      <option value="*" ${fSt === "*" ? "selected" : ""}>Semua status</option>
      ${Object.entries(ST).map(([k, v]) => `<option value="${k}" ${fSt === k ? "selected" : ""}>${v}</option>`).join("")}
    </select>
    <input class="search" type="search" value="${esc(qText)}" placeholder="Cari tugas, nama, detail..." oninput="qText=this.value;render()">
  </div>`;
}

let curColW = 50;
let fitView = true;
try { fitView = localStorage.getItem("planner-ev-fit") !== "0"; } catch (e) {}
function calcColW() {
  if (!fitView) return 50;
  const avail = document.documentElement.clientWidth - 28 - 2 - 190;
  return Math.max(20, Math.min(64, Math.floor(avail / Math.max(1, S.weeksCount))));
}
function toggleFit() {
  fitView = !fitView;
  try { localStorage.setItem("planner-ev-fit", fitView ? "1" : "0"); } catch (e) {}
  render();
}
function renderPlanner() {
  const { cols, months } = buildCols();
  const COL_W = calcColW();
  curColW = COL_W;
  const ROW_H = 50;
  const PAD = 10;
  const totalW = cols.length * COL_W;
  const vis = visibleTasks();

  const lanes = [...S.cats];
  if (vis.some(t => !t.cat || !S.cats.find(c => c.id === t.cat))) {
    lanes.push({ id: "", name: "Umum" });
  }

  let curY = 0;
  const laneData = lanes.map(ln => {
    const lt = vis.filter(t => (t.cat || "") === ln.id);
    const { rows, pos } = packRows(lt);
    const h = Math.max(68, rows * ROW_H + PAD * 2);
    const obj = { ln, lt, pos, topY: curY, h };
    curY += h + 1;
    return obj;
  });
  const bodyH = Math.max(120, curY);
  const boxes = new Map();

  const lanesHTML = laneData.map(g => {
    const { ln, lt, pos, topY, h } = g;
    const hols = S.holidays.map(hl => {
      const s = diffWeeks(S.startWk, hl.startWk);
      const e = diffWeeks(S.startWk, hl.endWk);
      if (e < 0 || s >= cols.length) return "";
      const c0 = Math.max(0, s), c1 = Math.min(cols.length - 1, e);
      return `<div class="hband hb-${hl.tone || "amber"}" style="left:${c0 * COL_W}px;width:${(c1 - c0 + 1) * COL_W}px"><span>${esc(hl.title)}</span></div>`;
    }).join("");

    const bars = lt.map(t => {
      const s = diffWeeks(S.startWk, t.startWk);
      const e = diffWeeks(S.startWk, t.endWk);
      if (e < 0 || s >= cols.length) return "";
      const c0 = Math.max(0, s), c1 = Math.min(cols.length - 1, e);
      const left = c0 * COL_W + 2;
      const width = Math.max(COL_W - 4, (c1 - c0 + 1) * COL_W - 4);
      const r = pos.get(t.id) || 0;
      const top = PAD + r * ROW_H + 3;
      const bh = ROW_H - 6;

      boxes.set(t.id, { x1: left, x2: left + width, y: topY + top + bh / 2 });

      const items = t.items || [];
      const done = items.filter(x => x.x).length;
      const tm = teamById(t.team);
      const picsStr = (t.pics || []).length ? ` · ${(t.pics || []).join(", ")}` : "";
      const sub = items.length
        ? `[${tm.short}${picsStr}] ` + items.map(x => (x.x ? "✓ " : "• ") + x.t).join(" · ")
        : `[${tm.short}${picsStr}] ${t.desc || ""}`;

      return `
      <div class="bar c-${t.color || "sage"} st-${t.st}"
           data-id="${t.id}"
           style="left:${left}px;top:${top}px;width:${width}px;height:${bh}px"
           onmouseenter="showTip(event,'${t.id}')"
           onmouseleave="hideTip()">
        <div class="rz l" data-rz="l"></div>
        <div class="bar-t">
          <span>${t.st === "x" ? "✓ " : t.st === "b" ? "! " : ""}${esc(t.title)}</span>
          ${items.length ? `<small style="opacity:.75">${done}/${items.length}</small>` : ""}
        </div>
        <div class="bar-d">${esc(sub)}</div>
        <div class="rz r" data-rz="r"></div>
      </div>`;
    }).join("");

    const vcols = cols.map((c, i) => {
      const mend = i < cols.length - 1 && cols[i + 1].mKey !== c.mKey;
      const cur = c.ymd === CUR_MON;
      return `<div class="vcol ${mend ? "mend" : ""} ${cur ? "cur" : ""}" style="width:${COL_W}px" title="Klik untuk tambah tugas · ${c.mWeekShort} ${c.mShort} (${c.rangeShort})" onclick="cellAdd('${ln.id}','${c.ymd}')"></div>`;
    }).join("");

    return `
    <div class="lane" style="height:${h}px">
      <div class="lane-lbl">
        <b>${esc(ln.name)}</b>
        <small>${lt.length} tugas</small>
        ${ln.id ? `<button onclick="openModal(null,'${ln.id}')">+ Tugas</button>` : ""}
      </div>
      <div class="lane-track" style="width:${totalW}px">
        <div class="vgrid">${vcols}</div>
        ${hols}
        ${bars}
      </div>
    </div>`;
  }).join("");

  let arrows = "";
  vis.forEach(t => {
    if (!t.dep) return;
    const a = boxes.get(t.dep), b = boxes.get(t.id);
    if (!a || !b) return;
    const xm = b.x1 > a.x2 + 8 ? a.x2 + (b.x1 - a.x2) / 2 : a.x2 + 10;
    const col = t.st === "b" ? "var(--bad)" : "var(--ink)";
    arrows += `<path d="M${a.x2} ${a.y} H${xm} V${b.y} H${b.x1}" fill="none" stroke="${col}" stroke-width="1.4" opacity=".65"/>
               <circle cx="${b.x1}" cy="${b.y}" r="3" fill="${col}"/>`;
  });

  const detailTasks = vis.filter(t => {
    if (focusWeek) return t.startWk <= focusWeek && t.endWk >= focusWeek;
    if (focusMonth) {
      const mc = cols.filter(c => c.mKey === focusMonth);
      if (!mc.length) return false;
      return t.startWk <= mc[mc.length - 1].ymd && t.endWk >= mc[0].ymd;
    }
    return true;
  }).sort((a, b) => a.startWk.localeCompare(b.startWk));

  const detailHeading = focusWeek
    ? `Detail dikerjakan · ${wkMeta(focusWeek).mWeekLabel} ${wkMeta(focusWeek).mFull} (${wkMeta(focusWeek).rangeShort})`
    : focusMonth
      ? `Detail dikerjakan · ${cols.find(c => c.mKey === focusMonth)?.mFull || focusMonth}`
      : `Tugas & detail yang dikerjakan`;

  const isEmpty = S.cats.length === 0 && S.tasks.length === 0;
  const totalMembers = allMembersList().length;

  return `
  <div class="hdr">
    <div>
      <h1>PLANNER EV 4W</h1>
      <p class="sub">Jadwal bulanan &amp; mingguan · ${S.teams.length} tim aktif (${totalMembers} anggota terdaftar)</p>
    </div>
    <div class="acts">
      <button class="sec" onclick="shiftRange(-13)">‹ 3 bln</button>
      <button class="sec" onclick="jumpNow()">Bulan ini</button>
      <button class="sec" onclick="shiftRange(13)">3 bln ›</button>
      <button class="sec" onclick="page='tim';render()">Atur anggota &amp; ID</button>
      <button class="sec" onclick="addCatPrompt()">+ Kategori</button>
      <button class="sec" onclick="toggleFit()" title="${fitView ? "Kembali ke lebar kolom normal (bisa digeser)" : "Pas-kan seluruh minggu ke lebar layar"}">${fitView ? "Lebar normal" : "Muat satu layar"}</button>
      <button class="pri" onclick="openModal()">Tugas baru</button>
    </div>
  </div>

  ${filterBar()}

  <div class="cd">
    <div class="tl-wrap ${COL_W < 34 ? "tight" : ""}">
      <div class="tl-inner">
        <div class="tl-hdr">
          <div class="tl-hrow">
            <div class="tl-corner">Bulan</div>
            <div style="display:flex">
              ${months.map(m => `<div class="tl-mcell ${focusMonth === m.mKey ? "on" : ""}" style="width:${m.span * COL_W}px" title="Klik untuk filter detail bulan ${m.mFull}" onclick="toggleMonth('${m.mKey}')">${m.mShort}</div>`).join("")}
            </div>
          </div>
          <div class="tl-hrow">
            <div class="tl-corner">Minggu</div>
            <div style="display:flex">
              ${cols.map((c, i) => {
                const mend = i < cols.length - 1 && cols[i + 1].mKey !== c.mKey;
                const cur = c.ymd === CUR_MON;
                return `<div class="tl-wcell ${mend ? "mend" : ""} ${cur ? "cur" : ""} ${focusWeek === c.ymd ? "on" : ""}"
                             style="width:${COL_W}px"
                             title="${c.mWeekLabel} ${c.mFull} (${c.rangeShort}) · ${c.wCode}"
                             onclick="toggleWeek('${c.ymd}')">
                          <b>${c.mWeekShort}</b>
                          <span>${c.startDayLabel}</span>
                        </div>`;
              }).join("")}
            </div>
          </div>
        </div>

        ${isEmpty ? `
          <div class="empty">
            <b style="font-size:18px">Planner masih kosong</b>
            <p>Tim <b>Energy Storage EV 4W</b>, <b>HVAC EV 4W</b>, <b>4W Knock Down</b>, dan <b>Vehicle Control Unit EV 4W</b> sudah siap. Silakan tambahkan nama anggota tim atau langsung buat tugas pertama Anda.</p>
            <button class="sec" onclick="page='tim';render()">+ Isi nama anggota tim</button>
            <button class="sec" onclick="addCatPrompt()">+ Buat kategori</button>
            <button class="pri" onclick="openModal()">Tugas pertama</button>
          </div>
        ` : `
          <div style="position:relative;height:${bodyH}px">
            ${lanesHTML}
            <svg class="dep-svg" width="${totalW}" height="${bodyH}">${arrows}</svg>
          </div>
        `}
      </div>
    </div>

    ${!isEmpty ? `
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:18px">
        <div>
          <b style="font-size:16px">${esc(detailHeading)}</b>
          <small style="display:block">Klik nama bulan atau kolom minggu (Mg 1–4) di atas untuk menyaring periode</small>
        </div>
        <div class="acts">
          ${(focusMonth || focusWeek) ? `<button class="sec" onclick="focusMonth='';focusWeek='';render()">Semua periode</button>` : ""}
          <button class="sec" onclick="toggleWeek(CUR_MON)">Minggu ini</button>
          <button class="sec" onclick="openReportModal()">Laporan Word / PDF</button>
        </div>
      </div>
      ${renderDetailCards(detailTasks)}
    ` : ""}
  </div>`;
}

function toggleMonth(k) { focusWeek = ""; focusMonth = focusMonth === k ? "" : k; render(); }
function toggleWeek(w) { focusMonth = ""; focusWeek = focusWeek === w ? "" : w; render(); }
function shiftRange(n) { S.startWk = addWeeks(S.startWk, n); persist(); render(); }
function jumpNow() { S.startWk = addWeeks(CUR_MON, -2); focusMonth = ""; focusWeek = ""; persist(); render(); }

function renderDetailCards(list) {
  if (!list.length) return `<p class="mut" style="margin:14px 0 2px">Tidak ada tugas pada periode atau filter ini.</p>`;
  return `
  <div class="dgrid">
    ${list.map(t => {
      const items = t.items || [];
      const done = items.filter(x => x.x).length;
      const tm = teamById(t.team);
      const pics = t.pics || [];
      return `
      <div class="dcard">
        <div class="dcard-hd">
          <b onclick="openModal('${t.id}')">${esc(t.title)}</b>
          <span class="tag ${t.st === "b" ? "bad" : t.st === "x" ? "ok" : ""}">${ST[t.st]}</span>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
          <span class="tag solid">${esc(tm.short || tm.name)}</span>
          <span class="tag">${esc(catName(t.cat))}</span>
          <small>${spanText(t.startWk, t.endWk)}</small>
        </div>
        ${pics.length ? `
          <div style="display:flex;gap:5px;flex-wrap:wrap;align-items:center">
            <small>Dikerjakan oleh:</small>
            ${pics.map(p => `<span class="tag"><span class="av" style="width:16px;height:16px;font-size:9px">${esc(ini(p))}</span> ${esc(p)}</span>`).join("")}
          </div>` : ""}
        ${t.desc ? `<div class="dcard-desc">${esc(t.desc)}</div>` : ""}
        ${items.length ? `
          <div class="chk-list">
            <small>Detail yang dikerjakan (${done}/${items.length}):</small>
            ${items.map((it, i) => `
              <label class="chk ${it.x ? "done" : ""}">
                <input type="checkbox" ${it.x ? "checked" : ""} onchange="toggleItem('${t.id}',${i})">
                <span>${esc(it.t)}</span>
              </label>`).join("")}
          </div>` : ""}
        ${t.out ? `<small>Output: <b>${esc(t.out)}</b></small>` : ""}
        ${t.bl ? `<small style="color:var(--bad)">Hambatan: ${esc(t.bl)}</small>` : ""}
      </div>`;
    }).join("")}
  </div>`;
}

function toggleItem(id, idx) {
  const t = byId(id);
  if (!t || !t.items || !t.items[idx]) return;
  t.items[idx].x = !t.items[idx].x;
  persist();
  render();
}

function renderMingguan() {
  const { cols } = buildCols();
  const vis = visibleTasks().sort((a, b) => a.startWk.localeCompare(b.startWk));

  const sections = cols.map(c => {
    const wt = vis.filter(t => t.startWk <= c.ymd && t.endWk >= c.ymd);
    if (onlyActivePeriods && !wt.length) return "";
    return `
    <div class="cd">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <div>
          <b style="font-size:17px">${c.mWeekLabel} · ${c.mFull}</b> <small>(${c.rangeShort} · ${c.wCode})</small>
          ${c.ymd === CUR_MON ? `<span class="tag ok" style="margin-left:6px">Minggu ini</span>` : ""}
        </div>

function renderBulanan() {
  const { cols, months } = buildCols();
  const vis = visibleTasks().sort((a, b) => a.startWk.localeCompare(b.startWk));

  const sections = months.map(m => {
    const mFirst = cols[m.startIdx].ymd;
    const mLast = cols[m.endIdx].ymd;
    const mt = vis.filter(t => t.startWk <= mLast && t.endWk >= mFirst);
    if (onlyActivePeriods && !mt.length) return "";
    return `
    <div class="cd">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
        <div>
          <b style="font-size:18px">${m.mFull}</b> <small>(${m.span} minggu: ${cols[m.startIdx].rangeShort.split("–")[0].trim()} – ${cols[m.endIdx].rangeShort.split("–").pop().trim()})</small>
        </div>
        <div class="acts">
          <span class="tag">${mt.length} tugas</span>
          <button class="sec" style="padding:5px 12px;font-size:12px" onclick="openModal(null,null,'${mFirst}')">+ Tugas di bulan ini</button>
        </div>
      </div>
      ${mt.length ? renderDetailCards(mt) : `<p class="mut" style="margin:10px 0 0">Belum ada tugas di bulan ini.</p>`}

  return `

    <div>

      <button class="pri" onclick="openModal()">Tugas baru</button>
    </div>
  </div>
  ${filterBar()}
  ${sections || `<div class="cd empty"><b style="font-size:18px">Belum ada tugas bulanan</b><p>Tambahkan tugas baru untuk melihat rincian per bulan.</p><button class="pri" onclick="openModal()">Tugas baru</button></div>`}`;

        <div class="cd">

function adv(id) {
  const t = byId(id);
  const n = { p: "d", d: "x", b: "d" }[t.st];
  if (!n) return;
  const o = t.st;
  t.st = n;
  persist();
  render();
  toast(`${t.title} → ${ST[n]}`, () => { t.st = o; persist(); render(); });
}

function addMember(teamId, inputEl) {
  const name = inputEl.value.trim();
  if (!name) return;
  const tm = S.teams.find(x => x.id === teamId);
  if (!tm) return;
  tm.members = tm.members || [];
  if (tm.members.some(m => m.toLowerCase() === name.toLowerCase())) {
    toast(`${name} sudah ada di tim ${tm.short}`);
    return;
  }
  tm.members.push(name);
  inputEl.value = "";
  persist();
  render();
  toast(`${name} ditambahkan ke ${tm.short}`);
}

function removeMember(teamId, mIdx) {
  const tm = S.teams.find(x => x.id === teamId);
  if (!tm || !tm.members) return;
  const removed = tm.members.splice(mIdx, 1)[0];
  persist();
  render();
  toast(`${removed} dihapus dari ${tm.short}`, () => {
    tm.members.splice(mIdx, 0, removed);
    persist();
    render();
  });
}

function addCatPrompt() {

  S.cats.push({ id: "cat_" + uid(), name: name.trim() });
  persist();
  render();
  toast("Kategori ditambahkan");
}
function moveCat(i, d) {
  const j = i + d;
  if (j < 0 || j >= S.cats.length) return;
  const [x] = S.cats.splice(i, 1);
  S.cats.splice(j, 0, x);
  persist();
  render();
}
function delCat(id) {
  if (!confirm("Hapus kategori ini?")) return;
  S.tasks.forEach(t => { if (t.cat === id) t.cat = ""; });
  S.cats = S.cats.filter(c => c.id !== id);
  persist();
  render();
}
function addHoliday() {
  const title = $("#h_t").value.trim();
  if (!title) { toast("Isi nama libur"); return; }
  let s = $("#hs_w").value, e = $("#he_w").value;
  if (e < s) [s, e] = [e, s];
  S.holidays.push({ id: "hol_" + uid(), title, startWk: s, endWk: e, tone: $("#h_c").value });
  persist();
  render();
  toast("Penanda libur ditambahkan");
}
function resetAll() {
  if (!confirm("Kosongkan semua tugas, kategori, dan penanda libur? (Daftar 4 tim dan nama anggota tetap disimpan)")) return;
  const old = JSON.parse(JSON.stringify(S));
  S.cats = [];
  S.holidays = [];
  S.tasks = [];
  persist();
  render();
  toast("Tugas & kategori dikosongkan", () => { S = old; persist(); render(); });
}

function getReportTasks(scope) {
  let list = scope === "all" ? [...S.tasks] : visibleTasks();
  if (scope === "filtered") {
    const { cols } = buildCols();
    if (focusWeek) {
      list = list.filter(t => t.startWk <= focusWeek && t.endWk >= focusWeek);
    } else if (focusMonth) {
      const mc = cols.filter(c => c.mKey === focusMonth);
      if (mc.length) {
        list = list.filter(t => t.startWk <= mc[mc.length - 1].ymd && t.endWk >= mc[0].ymd);
      }
    }
  }
  return list.sort((a, b) => a.startWk.localeCompare(b.startWk) || a.title.localeCompare(b.title));
}

function groupTasksForWorkLog(tasks) {
  const groups = [];
  const map = new Map();

  const addEntry = (key, picName, teamObj, task) => {
    if (!map.has(key)) {
      const grp = { key, pic: picName, team: teamObj, tasks: [] };
      map.set(key, grp);
      groups.push(grp);
    }
    map.get(key).tasks.push(task);
  };

  tasks.forEach(t => {
    const tm = teamById(t.team);
    const pics = (t.pics || []).filter(p => p && p.trim());
    if (pics.length) {
      pics.forEach(p => {
        if (fMember !== "*" && p !== fMember) return;
        addEntry(`${tm.id}::${p.toLowerCase()}`, p, tm, t);
      });
    } else {
      addEntry(`${tm.id}::__unassigned__`, "", tm, t);
    }
  });

  const teamOrder = new Map(S.teams.map((tm, idx) => [tm.id, idx]));
  groups.sort((a, b) => {
    const ta = teamOrder.has(a.team.id) ? teamOrder.get(a.team.id) : 99;
    const tb = teamOrder.has(b.team.id) ? teamOrder.get(b.team.id) : 99;
    if (ta !== tb) return ta - tb;
    if (!a.pic) return 1;
    if (!b.pic) return -1;
    return a.pic.localeCompare(b.pic);
  });

  return groups;
}

function buildSimpleWorkLogMarkup(opts) {
  const tasks = getReportTasks(opts.scope);
  const groups = groupTasksForWorkLog(tasks);

  let html = `
  <div style="font-family:Calibri,Arial,sans-serif;color:#111827;font-size:10.5pt;line-height:1.45;">
    <table style="width:100%;border-collapse:collapse;margin-bottom:14pt;">
      <tr>
        <td style="border-bottom:3pt double #111827;padding:0 0 6pt 0;font-size:14pt;font-weight:bold;">
          ${esc(opts.title)}
        </td>
      </tr>
    </table>

    <table style="width:100%;border-collapse:collapse;margin-bottom:14pt;">
      <tr>
        <td style="border:1pt solid #111827;padding:5pt 10pt;font-weight:bold;font-size:10.5pt;">
          ${esc(opts.sub)}
        </td>
      </tr>
    </table>`;

  if (!groups.length) {
    html += `<p style="color:#6b7280;">Tidak ada data tugas pada cakupan laporan ini.</p></div>`;
    return html;
  }

  groups.forEach(g => {
    const headerLabel = g.pic
      ? `<b>${esc(g.pic)} : ${esc(g.team.short || g.team.name)}</b> | <i style="color:#374151;">${esc(g.team.name)}</i>`
      : `<b>Tim ${esc(g.team.short || g.team.name)}</b> | <i style="color:#374151;">${esc(g.team.name)}</i>`;

    html += `<div style="margin:12pt 0 4pt 0;font-size:10.5pt;">${headerLabel}</div>`;
    html += `<ul style="margin:2pt 0 10pt 18pt;padding-left:4pt;list-style-type:disc;">`;

    g.tasks.forEach(t => {
      const subItems = [];

      if (t.desc) {
        t.desc.split(/\r?\n/).map(s => s.trim()).filter(Boolean).forEach(line => {
          subItems.push({ text: line, done: false });
        });
      }

      (t.items || []).forEach(it => {
        if (it.t && it.t.trim()) {
          subItems.push({ text: it.t.trim(), done: !!it.x });
        }
      });

      if (opts.incOut) {
        if (t.out) subItems.push({ text: `Output: ${t.out}`, done: false });
        if (t.bl) subItems.push({ text: `Hambatan: ${t.bl}`, done: false, bad: true });
        if (t.st === "x") subItems.push({ text: "DONE", done: false, bold: true });
        else if (t.st === "b" && !t.bl) subItems.push({ text: "HOLD / TERBLOKIR", done: false, bad: true });
      }

      let titleSuffix = "";
      if (opts.incWk) {
        titleSuffix += ` <span style="color:#4b5563;font-size:9.5pt;">(${esc(spanText(t.startWk, t.endWk))})</span>`;
      }
      if (subItems.length && !t.title.trim().endsWith(":")) {
        titleSuffix = ` :` + titleSuffix;
      }

      html += `<li style="margin:3pt 0;"><span>${esc(t.title)}${titleSuffix}</span>`;

      if (subItems.length) {
        html += `<ul style="margin:2pt 0 4pt 16pt;padding-left:4pt;list-style-type:circle;">`;
        subItems.forEach(si => {
          const styleAttr = si.bad
            ? `color:#b91c1c;font-weight:bold;`
            : si.bold
              ? `font-weight:bold;`
              : si.done
                ? `color:#374151;`
                : ``;
          const checkPrefix = si.done ? "✓ " : "";
          html += `<li style="margin:1.5pt 0;${styleAttr}">${checkPrefix}${esc(si.text)}</li>`;
        });
        html += `</ul>`;
      }

      html += `</li>`;
    });

    html += `</ul>`;
  });

  html += `</div>`;
  return html;
}

function buildSimpleWorkLogPlainText(opts) {
  const tasks = getReportTasks(opts.scope);
  const groups = groupTasksForWorkLog(tasks);
  const lines = [
    opts.title,
    "========================================================================",
    "",
    `[ ${opts.sub} ]`,
    ""
  ];

  groups.forEach(g => {
    lines.push(g.pic
      ? `${g.pic} : ${g.team.short || g.team.name} | ${g.team.name}`
      : `Tim ${g.team.short || g.team.name} | ${g.team.name}`
    );

    g.tasks.forEach(t => {
      const subItems = [];
      if (t.desc) {
        t.desc.split(/\r?\n/).map(s => s.trim()).filter(Boolean).forEach(line => subItems.push(line));
      }
      (t.items || []).forEach(it => {
        if (it.t && it.t.trim()) subItems.push((it.x ? "✓ " : "") + it.t.trim());
      });
      if (opts.incOut) {
        if (t.out) subItems.push(`Output: ${t.out}`);
        if (t.bl) subItems.push(`Hambatan: ${t.bl}`);
        if (t.st === "x") subItems.push("DONE");
        else if (t.st === "b" && !t.bl) subItems.push("HOLD / TERBLOKIR");
      }

      const wkPart = opts.incWk ? ` (${spanText(t.startWk, t.endWk)})` : "";
      const colon = subItems.length && !t.title.trim().endsWith(":") ? " :" : "";
      lines.push(`  • ${t.title}${colon}${wkPart}`);
      subItems.forEach(si => lines.push(`      ◦ ${si}`));
    });
    lines.push("");
  });

  return lines.join("\n");
}

function fallbackCopyText(text) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
  return ok;
}
