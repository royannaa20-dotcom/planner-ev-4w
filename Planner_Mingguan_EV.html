// INTUITIVE 2-STEP MONTH + WEEK PICKER
// ==========================================
let _cacheWeeks = null;
function buildAllWeeksData(base = "2025-01-06", count = 160) {
  if (_cacheWeeks) return _cacheWeeks;
  const list = [];
  const byMonth = {};
  const months = [];
  for (let i = 0; i < count; i++) {
    const w = wkMeta(addWeeks(base, i));
    list.push(w);
    if (!byMonth[w.mKey]) {
      byMonth[w.mKey] = [];
      months.push({ mKey: w.mKey, mFull: w.mFull, mShort: w.mShort });
    }
    byMonth[w.mKey].push(w);
  }
  _cacheWeeks = { list, byMonth, months };
  return _cacheWeeks;
}

// ==========================================
// KALENDER PEMILIH TANGGAL
// ==========================================
const CALS = {};
function calMount(elId, prefix, sYmd, eYmd, simple = false) {
  const s = fmtYMD(getMonday(parseYMD(sYmd)));
  const e = fmtYMD(getMonday(parseYMD(eYmd)));
  const th = parseYMD(s); th.setDate(th.getDate() + 3);
  CALS[prefix] = { elId, prefix, s, e: e < s ? s : e, active: "s", simple, open: false, y: th.getFullYear(), m: th.getMonth() };
  calRender(prefix);
}
function calRender(prefix) {
  const c = CALS[prefix];
  const host = $("#" + c.elId);
  if (!host) return;
  const hs = $(`#${prefix}s_w`), he = $(`#${prefix}e_w`);
  if (hs) hs.value = c.s;
  if (he) he.value = c.e;

  const today = fmtYMD(new Date());
  const gridStart = getMonday(new Date(c.y, c.m, 1));
  let cells = `<div class="cal-h">W</div>` + ["Sen","Sel","Rab","Kam","Jum","Sab","Min"].map(n => `<div class="cal-h">${n}</div>`).join("");
  for (let r = 0; r < 6; r++) {
    const mon = new Date(gridStart); mon.setDate(gridStart.getDate() + r * 7);
    const mk = fmtYMD(mon);
    const cls = (mk >= c.s && mk <= c.e ? "rb" : "") + (mk === c.s || mk === c.e ? " re" : "");
    cells += `<div class="cal-w ${cls}">${wkMeta(mk).wNum}</div>`;
    for (let i = 0; i < 7; i++) {
      const d = new Date(mon); d.setDate(mon.getDate() + i);
      const ds = fmtYMD(d);
      cells += `<button type="button" class="cal-d ${cls} ${d.getMonth() !== c.m ? "o" : ""} ${ds === today ? "today" : ""} ${i === 6 ? "wr" : ""}" title="${d.getDate()} ${MON_F[d.getMonth()]} ${d.getFullYear()}" onclick="calPick('${prefix}','${ds}')"><span>${d.getDate()}</span></button>`;
    }
  }
  const calBox = `
    <div class="cal-box">
      <div class="cal-nav">
        <b>${MON_F[c.m]} ${c.y}</b>
        <button type="button" class="t" onclick="calToday('${prefix}')">Hari ini</button>
        <button type="button" onclick="calNav('${prefix}',-1)" aria-label="Bulan sebelumnya">▲</button>
        <button type="button" onclick="calNav('${prefix}',1)" aria-label="Bulan berikutnya">▼</button>
      </div>
      <div class="cal-g">${cells}</div>
    </div>`;

  if (c.simple) {
    const len = diffWeeks(c.s, c.e) + 1;
    host.innerHTML = `
      <button type="button" class="cal-sum ${c.open ? "on" : ""}" onclick="calToggle('${prefix}')" aria-expanded="${c.open}">
        <span>${spanText(c.s, c.e)}</span><i>${c.open ? "Tutup" : "Ubah"}</i>
      </button>
      <div class="cal-dur">
        <span>Lama pengerjaan</span>
        <button type="button" onclick="calDur('${prefix}',-1)" ${len <= 1 ? "disabled" : ""} aria-label="Kurangi satu minggu">−</button>
        <b>${len} minggu</b>
        <button type="button" onclick="calDur('${prefix}',1)" aria-label="Tambah satu minggu">+</button>
      </div>
      ${c.open ? calBox : ""}`;
    return;
  }

  const box = (key, label, ymd) => {
    const m = wkMeta(ymd);
    return `<button type="button" class="cal-sel ${c.active === key ? "on" : ""}" onclick="calActive('${prefix}','${key}')"><small>${label}</small><b>${m.mWeekLabel} ${m.mFull}</b><span>${m.rangeShort} · ${m.wCode}</span></button>`;
  };
  host.innerHTML = `
    <div class="cal-top">${box("s", "Mulai dikerjakan", c.s)}${box("e", "Selesai dikerjakan", c.e)}</div>
    ${calBox}
    <div class="cal-prev">Jadwal terpilih: ${spanText(c.s, c.e)}</div>`;
}
function calToggle(prefix) {
  const c = CALS[prefix];
  c.open = !c.open;
  calRender(prefix);
}
function calDur(prefix, n) {
  const c = CALS[prefix];
  c.e = addWeeks(c.s, Math.max(0, diffWeeks(c.s, c.e) + n));
  calRender(prefix);
}
function calPick(prefix, ds) {
  const c = CALS[prefix];
  const d = parseYMD(ds);
  const mon = fmtYMD(getMonday(d));
  if (c.simple) {
    const span = diffWeeks(c.s, c.e);
    c.s = mon;
    c.e = addWeeks(mon, span);
    c.open = false;
    c.y = d.getFullYear();
    c.m = d.getMonth();
    calRender(prefix);
    return;
  }
  if (c.active === "s") {
    c.s = mon;
    if (c.e < c.s) c.e = c.s;
    c.active = "e";
  } else {
    c.e = mon;
    if (c.e < c.s) c.s = c.e;
  }
  c.y = d.getFullYear();
  c.m = d.getMonth();
  calRender(prefix);
}
function calActive(prefix, key) {
  const c = CALS[prefix];
  c.active = key;
  const th = parseYMD(key === "s" ? c.s : c.e); th.setDate(th.getDate() + 3);
  c.y = th.getFullYear(); c.m = th.getMonth();
  calRender(prefix);
}
function calNav(prefix, n) {
  const c = CALS[prefix];
  const d = new Date(c.y, c.m + n, 1);
  c.y = d.getFullYear(); c.m = d.getMonth();
  calRender(prefix);
}
function calToday(prefix) {
  const c = CALS[prefix];
  const d = new Date();
  c.y = d.getFullYear(); c.m = d.getMonth();
  calRender(prefix);
}

// ==========================================
// MODAL TAMBAH / UBAH TUGAS & DETAIL
// ==========================================
function renderCL() {
  $("#cl").innerHTML = CL.map((x, i) => `
    <div class="cl">
      <input type="checkbox" ${x.x ? "checked" : ""} onchange="CL[${i}].x=this.checked">
      <input value="${esc(x.t)}" oninput="CL[${i}].t=this.value" placeholder="Detail pekerjaan yang dilakukan">
      <button type="button" class="sec" style="padding:6px 11px" onclick="CL.splice(${i},1);renderCL()">×</button>
    </div>`).join("");
}

function renderModalMembers() {
  const box = $("#pic_box");
  if (!box) return;
  const tmId = $("#f_tm").value;
  const tm = teamById(tmId);
  const pool = [...new Set([...(tm.members || []), ...modalPics])];

  const showAdd = modalAddOpen || !pool.length;
  box.innerHTML = `
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">
      ${pool.map(name => {
        const on = modalPics.includes(name);
        return `
        <span class="mpick ${on ? "on" : ""}" onclick="toggleModalPic('${esc(name).replace(/'/g, "\\'")}')">
          <span class="av">${esc(ini(name))}</span>
          <span>${esc(name)}</span>
        </span>`;
      }).join("")}
      ${showAdd ? "" : `<span class="mpick add" onclick="openModalAdd()">+ Anggota</span>`}
    </div>
    ${showAdd ? `
    <div style="display:flex;gap:6px;margin-top:8px">
      <input id="new_pic_inp" placeholder="Nama anggota baru di ${esc(tm.short)}..." style="margin:0;flex:1" onkeydown="if(event.key==='Enter'){event.preventDefault();quickAddModalPic()}else if(event.key==='Escape'&&${pool.length ? "true" : "false"}){event.stopPropagation();modalAddOpen=false;renderModalMembers()}">
      <button type="button" class="sec" style="padding:7px 13px" onclick="quickAddModalPic()">Tambah</button>
    </div>` : ""}`;
}

function openModalAdd() {
  modalAddOpen = true;
  renderModalMembers();
  const inp = $("#new_pic_inp");
  if (inp) inp.focus();
}

function toggleModalPic(name) {
  const idx = modalPics.indexOf(name);
  if (idx >= 0) modalPics.splice(idx, 1);
  else modalPics.push(name);
  renderModalMembers();
}

function quickAddModalPic() {
  const inp = $("#new_pic_inp");
  if (!inp) return;
  const name = inp.value.trim();
  if (!name) return;
  const tmId = $("#f_tm").value;
  const tm = S.teams.find(x => x.id === tmId);
  if (tm) {
    tm.members = tm.members || [];
    if (!tm.members.some(m => m.toLowerCase() === name.toLowerCase())) {
      tm.members.push(name);
      persist();
    }
  }
  if (!modalPics.includes(name)) modalPics.push(name);
  modalAddOpen = false;
  renderModalMembers();
}

function cellAdd(catId, wkYmd) {
  openModal(null, catId, wkYmd, wkYmd);
}

function openModal(id = null, preCat = null, preWk = null, preEnd = null) {
  const t = id ? byId(id) : null;
  const defWk = preWk || focusWeek || CUR_MON;
  const defTeam = (fTeam !== "*" ? fTeam : (S.teams[0] && S.teams[0].id)) || "VC";

  const o = t || {
    title: "",
    team: defTeam,
    pics: [],
    cat: preCat !== null ? preCat : ((S.cats[0] && S.cats[0].id) || ""),
    startWk: defWk,
    endWk: preEnd || addWeeks(defWk, 2),
    desc: "",
    items: [{ t: "", x: false }],
    out: "",
    st: "p",
    color: "sage",
    dep: "",
    bl: ""
  };

  CL = (o.items || []).map(x => ({ ...x }));
  if (!CL.length) CL.push({ t: "", x: false });
  modalPics = [...(o.pics || [])];
  modalAddOpen = false;

  const others = S.tasks.filter(x => !t || x.id !== t.id).sort((a, b) => a.startWk.localeCompare(b.startWk));
  const curCatName = o.cat ? catName(o.cat) : "";

  $("#md").innerHTML = `
    <b style="font-size:18px">${t ? "Detail & ubah tugas" : "Tugas baru"}</b>

    <label>Tugasnya apa (Judul pekerjaan)</label>
    <input id="f_t" value="${esc(o.title)}" placeholder="mis. Uji bench BMS / Evaluasi HVAC / Validasi VCU">

    <div class="two">
      <label>Tim
        <select id="f_tm" onchange="modalPics=[];renderModalMembers()">
          ${S.teams.map(tm => `<option value="${tm.id}" ${tm.id === o.team ? "selected" : ""}>${esc(tm.name)}</option>`).join("")}
        </select>
      </label>
      <label>Kategori / Fase (pilih atau ketik baru)
        <input id="f_cat" list="cat_list" value="${esc(curCatName)}" placeholder="mis. Design, Ordering, Uji Kendaraan">
        <datalist id="cat_list">${S.cats.map(c => `<option value="${esc(c.name)}">`).join("")}</datalist>
      </label>
    </div>

    <label>Anggota tim yang mengerjakan (klik nama untuk memilih)</label>
    <div id="pic_box"></div>

    <label>Jadwal pengerjaan</label>
    <div id="cal_f"></div>
    <input type="hidden" id="fs_w" value="${o.startWk}"><input type="hidden" id="fe_w" value="${o.endWk}">

    <label>Dikerjakannya apa (Deskripsi singkat pekerjaan)</label>
    <textarea id="f_desc" rows="2" placeholder="Ringkasan ruang lingkup yang dikerjakan...">${esc(o.desc)}</textarea>

    <label>Detail yang dikerjakan apa saja (Checklist)</label>
    <div id="cl"></div>
    <button type="button" class="sec" style="margin-top:8px" onclick="CL.push({t:'',x:false});renderCL()">+ Tambah detail</button>

    <div class="two">
      <label>Status
        <select id="f_st">${Object.entries(ST).map(([k, v]) => `<option value="${k}" ${k === o.st ? "selected" : ""}>${v}</option>`).join("")}</select>
      </label>
      <label>Warna di timeline
        <select id="f_col">${Object.entries(BAR_COLORS).map(([k, v]) => `<option value="${k}" ${k === o.color ? "selected" : ""}>${v}</option>`).join("")}</select>
      </label>
    </div>

    <div class="two">
      <label>Output / Hasil
        <input id="f_out" value="${esc(o.out)}" placeholder="mis. Laporan uji / File DBC">
      </label>
      <label>Terhubung setelah tugas (Panah alur)
        <select id="f_dep">
          <option value="">Tidak ada</option>
          ${others.map(x => `<option value="${x.id}" ${x.id === o.dep ? "selected" : ""}>${wkMeta(x.startWk).mWeekShort} ${wkMeta(x.startWk).mShort} · ${esc(x.title)}</option>`).join("")}
        </select>
      </label>
    </div>

    <label>Hambatan / Catatan (Opsional)</label>
    <input id="f_bl" value="${esc(o.bl)}" placeholder="mis. Menunggu part / konfirmasi vendor">

    <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
      <button type="button" class="pri" onclick="saveTask('${t ? t.id : ""}')">Simpan</button>
      <button type="button" class="sec" onclick="closeModal()">Batal</button>
      <span style="flex:1"></span>
      ${t ? `<button type="button" class="sec" style="color:var(--bad)" onclick="delTask('${t.id}')">Hapus</button>` : ""}
    </div>`;

  renderModalMembers();
  calMount("cal_f", "f", o.startWk, o.endWk, true);
  renderCL();
  $("#ov").style.display = "grid";
  setTimeout(() => { const ft = $("#f_t"); if (ft) ft.focus(); }, 30);
}

const closeModal = () => $("#ov").style.display = "none";

function saveTask(id) {
  const title = $("#f_t").value.trim();
  if (!title) { toast("Isi judul tugas"); return; }

  const rawCat = $("#f_cat").value.trim();
  let catId = "";
  if (rawCat) {
    const existing = S.cats.find(c => c.name.toLowerCase() === rawCat.toLowerCase());
    if (existing) catId = existing.id;
    else {
      catId = "cat_" + uid();
      S.cats.push({ id: catId, name: rawCat });
    }
  }

  let sWk = $("#fs_w").value, eWk = $("#fe_w").value;
  if (eWk < sWk) [sWk, eWk] = [eWk, sWk];

  const data = {
    title,
    team: $("#f_tm").value,
    pics: [...modalPics],
    cat: catId,
    st: $("#f_st").value,
    startWk: sWk,
    endWk: eWk,
    desc: $("#f_desc").value.trim(),
    items: CL.filter(x => x.t.trim()).map(x => ({ t: x.t.trim(), x: !!x.x })),
    out: $("#f_out").value.trim(),
    color: $("#f_col").value,
    dep: $("#f_dep").value,
    bl: $("#f_bl").value.trim()
  };

  if (id) Object.assign(byId(id), data);
  else S.tasks.push({ id: "t_" + uid(), ...data });

  persist();
  closeModal();
  render();
  toast("Tugas disimpan");
}

function delTask(id) {
  const t = byId(id);
  S.tasks = S.tasks.filter(x => x.id !== id);
  persist();
  closeModal();
  render();
  toast("Tugas dihapus", () => { S.tasks.push(t); persist(); render(); });
}

// ==========================================
// DRAG & RESIZE ON TIMELINE
// ==========================================
let dg = null;
document.addEventListener("pointerdown", e => {
  const bar = e.target.closest(".bar");
  if (!bar) return;
  const t = byId(bar.dataset.id);
  if (!t) return;
  dg = {
    t,
    bar,
    rz: e.target.dataset.rz || "mv",
    x: e.clientX,
    s0: t.startWk,
    e0: t.endWk,
    dc: 0
  };
  bar.setPointerCapture(e.pointerId);
  bar.classList.add("drag");
  hideTip();
  e.preventDefault();
});
document.addEventListener("pointermove", e => {
  if (!dg) return;
  const dc = Math.round((e.clientX - dg.x) / curColW);
  if (dc === dg.dc) return;
  dg.dc = dc;
  if (dg.rz === "mv") {
    dg.t.startWk = addWeeks(dg.s0, dc);
    dg.t.endWk = addWeeks(dg.e0, dc);
  } else if (dg.rz === "l") {
    const c = addWeeks(dg.s0, dc);
    dg.t.startWk = c <= dg.e0 ? c : dg.e0;
  } else {
    const c = addWeeks(dg.e0, dc);
    dg.t.endWk = c >= dg.s0 ? c : dg.s0;
  }
  render();
});
document.addEventListener("pointerup", () => {
  if (!dg) return;
  const g = dg;
  dg = null;
  if (g.bar) g.bar.classList.remove("drag");
  if (!g.dc) { openModal(g.t.id); return; }
  persist();
  render();
  toast(`${g.t.title} → ${spanText(g.t.startWk, g.t.endWk)}`, () => {
    g.t.startWk = g.s0;
    g.t.endWk = g.e0;
    persist();
    render();
  });
});

// Tooltip
function showTip(e, id) {
  if (dg) return;
  const t = byId(id);
  if (!t) return;
  const tip = $("#tip");
  const tm = teamById(t.team);
  const pics = (t.pics || []).length ? `<br>PIC: ${(t.pics || []).map(esc).join(", ")}` : "";
  const items = (t.items || []).map(x => `${x.x ? "✓" : "•"} ${esc(x.t)}`).join("<br>");
  tip.innerHTML = `<b>${esc(t.title)}</b><br><span style="opacity:.85">${esc(tm.name)} · ${ST[t.st]}</span><br><span style="opacity:.85">${spanText(t.startWk, t.endWk)}</span>${pics}${t.desc ? `<br>${esc(t.desc)}` : ""}${items ? `<hr style="border:0;border-top:1px solid rgba(255,255,255,.2);margin:5px 0">${items}` : ""}`;
  tip.style.display = "block";
  moveTip(e);
}
function moveTip(e) {
  const tip = $("#tip");
  if (tip.style.display !== "block") return;
  tip.style.left = Math.min(window.innerWidth - 330, e.clientX + 12) + "px";
  tip.style.top = Math.min(window.innerHeight - 180, e.clientY + 12) + "px";
}
const hideTip = () => $("#tip").style.display = "none";
document.addEventListener("mousemove", moveTip);

// Export & Import JSON
function expData() {
  const b = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = "planner-ev-" + fmtYMD(new Date()) + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  toast("Cadangan diunduh");
}
$("#imp").onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.tasks)) throw 0;
      if (!confirm(`Ganti semua data saat ini dengan isi cadangan (${d.tasks.length} tugas)?`)) return;
      S = normalizeState(d);
      persist();
      render();
      toast("Cadangan dipulihkan");
    } catch (err) {
      toast("File cadangan tidak valid");
    }
  };
  r.readAsText(f);
  e.target.value = "";
};

// Navigation & Theme
document.querySelectorAll(".nav [data-p]").forEach(b => b.onclick = () => { page = b.dataset.p; render(); });
$("#ov").onclick = e => { if (e.target.id === "ov") closeModal(); };
$("#th").onclick = () => {
  const r = document.documentElement;
  const d = r.dataset.theme === "dark" || (!r.dataset.theme && matchMedia("(prefers-color-scheme:dark)").matches);
  r.dataset.theme = d ? "light" : "dark";
};

function render() {
  document.querySelectorAll(".nav [data-p]").forEach(b => b.classList.toggle("on", b.dataset.p === page));
  $("#app").innerHTML = ({
    planner: renderPlanner,
    mingguan: renderMingguan,
    bulanan: renderBulanan,
    status: renderStatus,
    tim: renderTim,
    atur: renderAtur
  })[page]();

  if (page === "atur") {
    calMount("cal_h", "h", CUR_MON, CUR_MON);
  }
}

let _rzT;
window.addEventListener("resize", () => {
  clearTimeout(_rzT);
  _rzT = setTimeout(() => {
    if (page === "planner" && !dg && $("#ov").style.display !== "grid" && calcColW() !== curColW) render();
  }, 150);
});

currentUserId = loadAuthSession();
updateUserBadge();
render();

const _savedFb = getSavedFbSettings();
if (_savedFb) {
  initFirebaseSync(_savedFb, false);
} else {
  updateFbBadge();
  syncAuthGate();
}
</script>
